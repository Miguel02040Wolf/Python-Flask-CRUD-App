name: CI - Python Flask CRUD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install flask flask-mysqldb flask_fontawesome mysqlclient

      - name: Verificar sintaxis Python
        run: |
          python -m py_compile app.py
          echo "✅ Sintaxis correcta"

      - name: Lint (calidad de código)
        run: |
          pip install flake8
          flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=120
          echo "✅ Lint completado"